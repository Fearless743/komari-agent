# FreeBSD base libraries.
#
# The Rust FreeBSD target spec links libgeom/libkvm/libmemstat/libprocstat/
# libdevstat. The cross-rs images do not ship them, so CI extracts the
# matching 12.4-RELEASE base set into /freebsd (see Cross.toml).
#
# FreeBSD's `libc.so`/`libm.so` are linker scripts containing absolute paths
# such as `/lib/libc.so.7`; `--sysroot` rewrites them under /freebsd.
# `-rpath-link` resolves the transitive shared-library dependencies of
# libgeom/libkvm (libbsdxml, libsbuf, libelf).
# These flags are ignored on hosts where /freebsd does not exist.

[target.x86_64-unknown-freebsd]
rustflags = [
  "-L", "native=/freebsd/usr/lib",
  "-L", "native=/freebsd/lib",
  "-C", "link-arg=-Wl,--sysroot=/freebsd",
  "-C", "link-arg=-Wl,-rpath-link=/freebsd/lib",
  "-C", "link-arg=-Wl,-rpath-link=/freebsd/usr/lib",
]

[target.i686-unknown-freebsd]
rustflags = [
  "-L", "native=/freebsd/usr/lib",
  "-L", "native=/freebsd/lib",
  "-C", "link-arg=-Wl,--sysroot=/freebsd",
  "-C", "link-arg=-Wl,-rpath-link=/freebsd/lib",
  "-C", "link-arg=-Wl,-rpath-link=/freebsd/usr/lib",
]

[target.aarch64-unknown-freebsd]
# Built with cargo-zigbuild, whose linker wrapper rejects `-Wl,--sysroot`
# but accepts the driver-level `--sysroot`.
rustflags = [
  "-L", "native=/freebsd/usr/lib",
  "-L", "native=/freebsd/lib",
  "-C", "link-arg=--sysroot=/freebsd",
  "-C", "link-arg=-Wl,-rpath-link=/freebsd/lib",
  "-C", "link-arg=-Wl,-rpath-link=/freebsd/usr/lib",
]
