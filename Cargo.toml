[workspace]
resolver = "3"
members = [
    "crates/agent-cli",
    "crates/agent-config",
    "crates/agent-monitor",
    "crates/agent-protocol",
    "crates/agent-client",
    "crates/agent-discovery",
    "crates/agent-update",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Fearless743/komari-agent"

[workspace.dependencies]
# Runtime / async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System information
sysinfo = "0.40"

# Networking
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "json"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
dirs = "7"
once_cell = "1"
parking_lot = "0.13"
semver = { version = "1", features = ["serde"] }

# Dev dependencies
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
