name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  build:
    name: ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: komari-agent-linux-amd64
            tool: zigbuild
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: komari-agent-linux-arm64
            tool: zigbuild
          - runner: ubuntu-latest
            target: i686-unknown-linux-musl
            asset: komari-agent-linux-386
            tool: zigbuild
          - runner: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            asset: komari-agent-linux-arm
            tool: zigbuild
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: komari-agent-windows-amd64.exe
            tool: cargo
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            asset: komari-agent-windows-arm64.exe
            tool: cargo
          - runner: windows-latest
            target: i686-pc-windows-msvc
            asset: komari-agent-windows-386.exe
            tool: cargo
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: komari-agent-darwin-amd64
            tool: cargo
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: komari-agent-darwin-arm64
            tool: cargo
          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            asset: komari-agent-freebsd-amd64
            tool: zigbuild
          - runner: ubuntu-latest
            target: aarch64-unknown-freebsd
            asset: komari-agent-freebsd-arm64
            tool: zigbuild
          - runner: ubuntu-latest
            target: i686-unknown-freebsd
            asset: komari-agent-freebsd-386
            tool: zigbuild

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$HOME/zigbuild-venv"
          "$HOME/zigbuild-venv/bin/pip" install --upgrade pip
          "$HOME/zigbuild-venv/bin/pip" install cargo-zigbuild ziglang
          echo "$HOME/zigbuild-venv/bin" >> "$GITHUB_PATH"

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA}"
          fi
          echo "KOMARI_AGENT_VERSION=${version}" >> "$GITHUB_ENV"
          echo "KOMARI_AGENT_VERSION_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.tool }}" = "zigbuild" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}" -p agent-cli
          else
            cargo build --release --locked --target "${{ matrix.target }}" -p agent-cli
          fi

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/komari-agent"
          if [ -f "${binary}.exe" ]; then
            binary="${binary}.exe"
          fi
          cp "$binary" "${{ matrix.asset }}"
          ls -l "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
